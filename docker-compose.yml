services:
  # 1. Banco de Dados - MongoDB
  mongodb:
    image: mongo:6
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: always
    healthcheck: # Adicione este bloco (Atenção à indentação aqui também!)
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Message Broker - RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    hostname: rabbitmq_host
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/mnesia

    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-nestjs:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: api-nestjs
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://admin:password@mongodb:27017/weatherdb?authSource=admin
      PORT: 3000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
      JWT_SECRET: SEGREDO_MUITO_SECRETO_E_FORTE_DO_PROJETO

    # 🛠️ COMANDO DE ESPERA USANDO CURL (Mais provável de funcionar, pois o curl já está lá)
    command: >
      sh -c "while ! curl --silent --fail http://mongodb:27017; do
        echo 'Aguardando o MongoDB (27017)...';
        sleep 1;
      done;
      npm run start:prod" # OU o seu comando de inicialização

    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

    volumes:
      - ./backend:/app # Mapeamento para desenvolvimento (hot-reload)
      - /app/node_modules # Evitar conflito no volume de node_modules
      - /app/dist

  # 4. Worker - Go
  worker-go:
    build:
      context: ./worker-go
      dockerfile: Dockerfile
    container_name: worker-go
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      NESTJS_API_URL: http://api-nestjs:3000
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-nestjs:
        condition: service_healthy # Agora espera o NestJS saudável
    volumes:
      - ./worker-go:/app

  # 5. Data Collector - Python
  data-collector:
    build:
      context: ./data-collector
      dockerfile: Dockerfile
    container_name: data-collector
    # Usaremos um comando para rodar o script (ex: com um cron-like)
    command: python /app/collector.py
    environment:
      PORT: 3000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      OPENMETEO_CITY: "Sua Cidade Aqui" # Ex: 'Sao Paulo'
      OPENMETEO_LAT: 52.52 # Ex: latitude do seu local
      OPENMETEO_LON: 13.41 # Ex: longitude do seu local
    depends_on:
      - rabbitmq
    volumes:
      - ./data-collector:/app

  # 6. Frontend - React/Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # Usaremos um Dockerfile para ambiente de desenvolvimento com Vite
    container_name: frontend
    ports:
      - "5173:5173" # Porta padrão do Vite
    environment:
      VITE_API_URL: http://localhost:3000 # URL da API para o Frontend (acessível pelo browser)
      # Importante: para acesso interno ao Docker, use 'http://api-nestjs:3000'
    depends_on:
      - api-nestjs
    volumes:
      - ./frontend:/app
      - /app/node_modules

# Volumes para persistir os dados do MongoDB
volumes:
  mongodb_data:
    driver: local
  rabbitmq_data:
    driver: local
